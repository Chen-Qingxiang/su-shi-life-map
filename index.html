<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A reading map for Su Shi's life locations, with 1080 historical regime overlays from Hartwell China Historical GIS.">
  <title>苏轼生平行迹地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --text: #202124;
      --muted: #667085;
      --line: #d0d5dd;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --early: #1f77b4;
      --office: #2ca02c;
      --trial: #d62728;
      --return: #9467bd;
      --exile: #ff7f0e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 20px;
      overflow: auto;
      max-height: 100vh;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.25;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      margin: 0 0 16px;
    }

    h2.side-heading {
      margin: 18px 0 8px;
      font-size: 13px;
      line-height: 1.3;
      color: #344054;
      font-weight: 700;
    }

    .source-note {
      border-left: 3px solid #98a2b3;
      padding-left: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      margin: 0 0 14px;
    }

    .legend {
      display: grid;
      gap: 7px;
      margin: 14px 0 18px;
      font-size: 13px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex: none;
    }

    .swatch {
      width: 18px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
      flex: none;
      opacity: 0.78;
    }

    .muted-line {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    button.place {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px 11px;
      cursor: pointer;
      color: var(--text);
    }

    button.place:hover {
      border-color: #98a2b3;
      background: #fafafa;
    }

    .place strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
    }

    .place small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 3px;
    }

    #map {
      width: 100%;
      height: 100vh;
      min-height: 640px;
    }

    .popup h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .popup p {
      margin: 4px 0;
      font-size: 13px;
      line-height: 1.45;
    }

    .fallback {
      display: none;
      padding: 24px;
      font-size: 15px;
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }

      aside {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      #map {
        height: 72vh;
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>苏轼生平行迹地图</h1>
      <p class="sub">根据《苏东坡新传》章节主线整理。地点使用现代城市近似坐标，路线连线用于理解人生阶段，不代表精确古道。</p>
      <p class="source-note">右上角可开关“1080 年政权区域”“县级/行政区边界（Hartwell）”“政权外缘边界（栅格化近似）”“山川河流古道（示意）”等图层。历史区域来自 Hartwell/CHGIS；山川河流古道为读书辅助示意，不等于精确考据。</p>
      <h2 class="side-heading">人生阶段</h2>
      <div class="legend" id="legend"></div>
      <h2 class="side-heading">1080 年政权区域（色盲友好配色）</h2>
      <div class="legend" id="regimeLegend"></div>
      <h2 class="side-heading">地点</h2>
      <div class="list" id="placeList"></div>
    </aside>
    <section>
      <div id="map"></div>
      <div class="fallback" id="fallback">地图脚本没有加载。可以查看 <code>data/su-shi-life-locations.geojson</code>，或在联网环境中重新打开本文件。</div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/su-shi-life-locations.js"></script>
  <script src="data/historical-regimes-1080.js"></script>
  <script src="data/historical-regime-boundaries-1080.js"></script>
  <script>
    const stages = {
      "少年与家族": { color: "#1f77b4", label: "少年与家族" },
      "出蜀远行": { color: "#1f77b4", label: "出蜀远行" },
      "入仕与朝廷": { color: "#2ca02c", label: "入仕与朝廷" },
      "初仕": { color: "#2ca02c", label: "初仕" },
      "地方治理": { color: "#2ca02c", label: "地方治理" },
      "诗狱转折": { color: "#d62728", label: "诗狱转折" },
      "黄州与东坡": { color: "#d62728", label: "黄州与东坡" },
      "漂泊江淮": { color: "#9467bd", label: "漂泊江淮" },
      "元祐后期外任": { color: "#9467bd", label: "元祐后期外任" },
      "岭海贬谪": { color: "#ff7f0e", label: "岭海贬谪" },
      "北归": { color: "#ff7f0e", label: "北归" }
    };

    const lifeLocations = window.suShiLifeLocations || { type: "FeatureCollection", features: [] };

    function toLatLng(coordinates) {
      return [coordinates[1], coordinates[0]];
    }

    const stops = lifeLocations.features
      .filter((feature) => feature.geometry?.type === "Point" && feature.properties?.kind === "stop")
      .map((feature) => {
        const [lon, lat] = feature.geometry.coordinates;
        return { ...feature.properties, lat, lon };
      })
      .sort((a, b) => a.order - b.order);

    const routeFeature = lifeLocations.features.find((feature) => feature.geometry?.type === "LineString" && feature.properties?.kind === "route");
    const route = routeFeature
      ? routeFeature.geometry.coordinates.map(toLatLng)
      : stops.map((stop) => [stop.lat, stop.lon]);

    const uniqueLegend = [
      ["少年与家族 / 出蜀远行", "#1f77b4"],
      ["入仕、初仕与地方治理", "#2ca02c"],
      ["诗狱与黄州", "#d62728"],
      ["漂泊江淮 / 元祐后期外任", "#9467bd"],
      ["岭海贬谪与北归", "#ff7f0e"]
    ];

    const REGIME_COLORS = {
      northern_song: "#C0392B",
      liao: "#2E86C1",
      western_xia: "#F39C12",
      dali: "#27AE60",
      tufan_tribes: "#8E44AD",
      heihan: "#16A085",
      yutian: "#7F8C8D",
      liuqiu: "#34495E",
      abor: "#A04000"
    };

    const geoOverlays = {
      rivers: {
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { name: "长江（示意）" }, geometry: { type: "LineString", coordinates: [[98.6,28.4],[101.8,30.7],[104.1,30.7],[106.5,29.6],[108.4,30.7],[111.3,30.7],[114.3,30.6],[117.2,31.3],[119.8,31.5],[121.8,31.2]] } },
          { type: "Feature", properties: { name: "黄河（示意）" }, geometry: { type: "LineString", coordinates: [[96.0,35.0],[100.5,36.0],[103.8,37.5],[106.8,38.3],[110.8,39.2],[112.7,37.7],[111.9,35.5],[113.7,34.8],[118.6,37.6]] } }
        ]
      },
      roads: {
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { name: "蜀道（剑门方向，示意）" }, geometry: { type: "LineString", coordinates: [[103.8,30.1],[104.7,31.4],[105.7,32.4],[106.2,33.2],[107.0,34.0]] } },
          { type: "Feature", properties: { name: "岭南北归古道（示意）" }, geometry: { type: "LineString", coordinates: [[109.6,19.5],[113.3,23.1],[113.6,24.8],[114.9,25.8],[119.9,31.8]] } }
        ]
      },
      mountains: {
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { name: "秦岭（示意）" }, geometry: { type: "LineString", coordinates: [[104.0,33.5],[106.0,34.0],[108.0,34.2],[110.5,34.3]] } },
          { type: "Feature", properties: { name: "横断山地（示意）" }, geometry: { type: "LineString", coordinates: [[98.5,24.5],[99.5,27.0],[100.0,29.0],[100.8,31.0]] } }
        ]
      }
    };

    function popupHtml(stop) {
      return `
        <div class="popup">
          <h2>${stop.order}. ${stop.name}</h2>
          <p><strong>现代地名：</strong>${stop.modern}</p>
          <p><strong>时间：</strong>${stop.age_detail || `${stop.years}（约 ${stop.age} 岁）`}</p>
          <p><strong>阶段：</strong>${stop.stage}</p>
          <p><strong>章节：</strong>${stop.chapter}</p>
          <p>${stop.event}</p>
          <p>${stop.note}</p>
        </div>
      `;
    }

    function regimePopupHtml(feature) {
      const props = feature.properties;
      const unitName = props.unit_name || props.unit_name_short || props.regime_name_zh;
      const province = props.province_zh || props.province || "无";
      const pinyin = props.unit_pinyin ? `<p><strong>拼音：</strong>${props.unit_pinyin}</p>` : "";
      return `
        <div class="popup">
          <h2>${unitName}</h2>
          <p><strong>年代：</strong>${props.year} 年前后</p>
          <p><strong>政权：</strong>${props.regime_name_zh} / ${props.regime_name}</p>
          <p><strong>行政类型：</strong>${props.admin_type_zh || props.admin_type || "未标明"}</p>
          <p><strong>所属上层区划：</strong>${province}</p>
          ${pinyin}
          <p><strong>源图层：</strong>${props.source_layer}</p>
          <p>${props.note}</p>
          <p><strong>说明：</strong>Hartwell/CHGIS 的 co-location 区域近似，已转换为网页地图坐标；不是严格国界考证。</p>
        </div>
      `;
    }

    function init() {
      const legend = document.querySelector("#legend");
      uniqueLegend.forEach(([label, color]) => {
        const row = document.createElement("span");
        row.innerHTML = `<i class="dot" style="background:${color}"></i>${label}`;
        legend.appendChild(row);
      });

      const regimeLegend = document.querySelector("#regimeLegend");
      if (window.historicalRegimes1080?.features?.length) {
        const regimes = new Map();
        window.historicalRegimes1080.features.forEach((feature) => {
          const props = feature.properties;
          if (!regimes.has(props.regime_key)) {
            regimes.set(props.regime_key, {
              label: props.regime_name_zh,
              color: REGIME_COLORS[props.regime_key] || props.color
            });
          }
        });
        regimes.forEach(({ label, color }) => {
          const row = document.createElement("span");
          row.innerHTML = `<i class="swatch" style="background:${color}"></i>${label}`;
          regimeLegend.appendChild(row);
        });
      } else {
        regimeLegend.innerHTML = `<span class="muted-line">历史区域数据未加载。</span>`;
      }

      if (!window.L) {
        document.querySelector("#map").style.display = "none";
        document.querySelector("#fallback").style.display = "block";
        return;
      }

      const map = L.map("map", { scrollWheelZoom: true }).setView([30.5, 112.5], 5);
      const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap contributors" });
      const topo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, attribution: "&copy; OpenTopoMap" });
      const satellite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 18, attribution: "Tiles &copy; Esri" });
      map.createPane("historicalRegimes");
      map.getPane("historicalRegimes").style.zIndex = 320;
      map.createPane("lifeRoute");
      map.getPane("lifeRoute").style.zIndex = 430;
      map.createPane("lifeMarkers");
      map.getPane("lifeMarkers").style.zIndex = 440;
      osm.addTo(map);

      const historicalLayer = window.historicalRegimes1080 ? L.geoJSON(window.historicalRegimes1080, {
        pane: "historicalRegimes",
        style: (feature) => {
          const color = REGIME_COLORS[feature.properties.regime_key] || feature.properties.color || "#667085";
          return {
            color,
            weight: 0.7,
            opacity: 0.36,
            fillColor: color,
            fillOpacity: 0.14
          };
        },
        onEachFeature: (feature, layer) => {
          const props = feature.properties;
          const unitName = props.unit_name || props.unit_name_short || props.regime_name_zh;
          const province = props.province_zh || props.province;
          const label = province ? `${unitName} · ${province} · ${props.regime_name_zh}` : `${unitName} · ${props.regime_name_zh}`;
          layer.bindTooltip(label, { sticky: true });
          layer.bindPopup(regimePopupHtml(feature), { maxWidth: 320 });
        }
      }).addTo(map) : null;

      const routeLine = L.polyline(route, {
        pane: "lifeRoute",
        color: "#475467",
        weight: 2,
        opacity: 0.72,
        dashArray: "6 7"
      }).addTo(map);

      const markers = new Map();
      const markerLayer = L.layerGroup().addTo(map);
      stops.forEach((stop) => {
        const color = stages[stop.stage]?.color || "#344054";
        const marker = L.circleMarker([stop.lat, stop.lon], {
          radius: 7,
          pane: "lifeMarkers",
          color: "#ffffff",
          weight: 2,
          fillColor: color,
          fillOpacity: 0.92
        }).addTo(markerLayer).bindPopup(popupHtml(stop), { maxWidth: 320 });
        marker.bindTooltip(`${stop.order}. ${stop.name}`, { direction: "top", offset: [0, -8] });
        markers.set(stop.order, marker);
      });

      const adminBorderLayer = window.historicalRegimes1080 ? L.geoJSON(window.historicalRegimes1080, {
        pane: "historicalRegimes",
        style: (feature) => ({ color: REGIME_COLORS[feature.properties.regime_key] || "#344054", weight: 1.8, opacity: 0.95, fillOpacity: 0 }),
        interactive: false
      }) : null;

      const regimeBoundaryLayer = window.historicalRegimeBoundaries1080 ? L.geoJSON(window.historicalRegimeBoundaries1080, {
        pane: "historicalRegimes",
        style: (feature) => ({ color: REGIME_COLORS[feature.properties.regime_key] || "#111827", weight: 2.6, opacity: 0.95, fillOpacity: 0, dashArray: "10 6" }),
        onEachFeature: (f, l) => l.bindTooltip(`${f.properties.regime_name_zh}（政权外缘边界，栅格化近似）`, { sticky: true })
      }) : null;

      const riverLayer = L.geoJSON(geoOverlays.rivers, { style: { color: "#1f78b4", weight: 2.2, opacity: 0.85 }, onEachFeature: (f, l) => l.bindTooltip(f.properties.name, { sticky: true }) }).addTo(map);
      const roadLayer = L.geoJSON(geoOverlays.roads, { style: { color: "#8b5e3c", weight: 2, dashArray: "8 6", opacity: 0.9 }, onEachFeature: (f, l) => l.bindTooltip(f.properties.name, { sticky: true }) }).addTo(map);
      const mountainLayer = L.geoJSON(geoOverlays.mountains, { style: { color: "#6b7280", weight: 2.4, dashArray: "3 8", opacity: 0.8 }, onEachFeature: (f, l) => l.bindTooltip(f.properties.name, { sticky: true }) }).addTo(map);

      if (historicalLayer) {
        const overlayLayers = {
          "1080 年政权区域（Hartwell/CHGIS）": historicalLayer,
          "县级/行政区边界（Hartwell）": adminBorderLayer,
          "苏轼行迹路线": routeLine,
          "苏轼地点": markerLayer,
          "河流（示意）": riverLayer,
          "山脉（示意）": mountainLayer,
          "古道（示意）": roadLayer
        };
        if (regimeBoundaryLayer) {
          overlayLayers["政权外缘边界（栅格化近似）"] = regimeBoundaryLayer;
        }
        L.control.layers({"在线底图（OSM）": osm, "地形底图（OpenTopoMap）": topo, "卫星底图（Esri）": satellite}, overlayLayers, {
          collapsed: false
        }).addTo(map);
      }

      if (route.length) {
        const bounds = routeLine.getBounds();
        map.fitBounds(bounds.pad(0.15));
      }

      const list = document.querySelector("#placeList");
      if (!stops.length) {
        list.innerHTML = `<p class="muted-line">地点数据未加载。</p>`;
      }
      stops.forEach((stop) => {
        const color = stages[stop.stage]?.color || "#344054";
        const button = document.createElement("button");
        button.type = "button";
        button.className = "place";
        button.innerHTML = `
          <strong><span class="dot" style="background:${color}"></span>${stop.order}. ${stop.name}</strong>
          <small>${stop.age_detail || `${stop.years}（约 ${stop.age} 岁）`} · ${stop.stage}</small>
          <small>${stop.event}</small>
        `;
        button.addEventListener("click", () => {
          map.setView([stop.lat, stop.lon], 8, { animate: true });
          markers.get(stop.order).openPopup();
        });
        list.appendChild(button);
      });
    }

    init();
  </script>
</body>
</html>
