<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A reading map for Su Shi's life locations, with 1080 historical regime overlays from Hartwell China Historical GIS.">
  <title>苏轼生平行迹地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main>
    <aside>
      <h1>苏轼生平行迹地图</h1>
      <p class="sub">根据《苏东坡新传》章节主线整理。地点使用现代城市近似坐标，路线连线用于理解人生阶段，不代表精确古道。</p>
      <p class="source-note">右上角可开关“1080 年政权区域”“县级/行政区边界（Hartwell）”“政权外缘边界（栅格化近似）”“山川河流古道（示意）”等图层。历史区域来自 Hartwell/CHGIS；山川河流古道为读书辅助示意，不等于精确考据。</p>
      <h2 class="side-heading">人生阶段</h2>
      <div class="legend" id="legend"></div>
      <h2 class="side-heading">1080 年政权区域（色盲友好配色）</h2>
      <div class="legend" id="regimeLegend"></div>
      <h2 class="side-heading">地点关联</h2>
      <div class="detail-panel" id="detailPanel"></div>
      <h2 class="side-heading">地点</h2>
      <div class="list" id="placeList"></div>
    </aside>
    <section>
      <div id="map"></div>
      <div class="fallback" id="fallback">地图脚本没有加载。可以查看 <code>data/su-shi-life-locations.geojson</code>，或在联网环境中重新打开本文件。</div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/su-shi-life-locations.js"></script>
  <script src="data/historical-regimes-1080.js"></script>
  <script src="data/historical-regime-boundaries-1080.js"></script>
  <script src="data/sushi-people.js"></script>
  <script src="data/sushi-relations.js"></script>
  <script src="data/sushi-events.js"></script>
  <script src="data/sushi-works.js"></script>
  <script src="src/config.js"></script>
  <script src="src/data.js"></script>
  <script src="src/knowledge.js"></script>
  <script src="src/popups.js"></script>
  <script src="src/sidebar.js"></script>
  <script src="src/map.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
